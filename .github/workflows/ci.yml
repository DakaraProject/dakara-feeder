name: Tests

on:
  pull_request:
  push:
    branches:
      - master
      - develop

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install python tests dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v --cov-report xml:coverage.xml --cov src tests/unit

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.python-version }}-unit-tests-coverage
          path: ./coverage.xml

  integration-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install native dependencies (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mediainfo
        if: matrix.os == 'ubuntu-latest'

      - name: Install native dependencies (MacOS)
        run: brew install ffmpeg mediainfo
        if: matrix.os == 'macos-latest'

      - name: Install native dependencies (Windows)
        run: choco install --no-progress ffmpeg mediainfo-cli
        if: matrix.os == 'windows-latest'

      - name: Print ffprobe and mediainfo versions
        run: ffprobe -version && mediainfo --version

      - name: Install python tests dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v --cov-report xml:coverage.xml --cov src tests/integration

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-integration-tests-coverage
          path: ./coverage.xml

  static-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run import order checks
        run: python -m isort . --check

      - name: Run style checks
        run: python -m black . --check

      - name: Run ruff linter
        run: python -m ruff check .

  upload-codecov-reports:
    needs:
      - unit-tests
      - integration-tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
